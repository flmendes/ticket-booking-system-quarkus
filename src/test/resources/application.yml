quarkus:
  application:
    name: ticket-booking-system

  # Database Configuration - H2 in-memory for fast tests
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      max-size: 10
      min-size: 2

  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: false
    dialect: org.hibernate.dialect.H2Dialect
    # Ensures sequences and other PostgreSQL-like behavior
    sql-load-script: import.sql
  
  # Redis Configuration - Disabled for tests (using mock)
  redis:
    # Mock implementation is used in tests
    devservices:
      enabled: false
    health:
      enabled: false


  # HTTP Configuration
  http:
    port: 8080

  # Logging
  log:
    level: INFO
    category:
      "com.ticketing":
        level: DEBUG

# Application Specific Configuration
ticketing:
  reservation:
    timeout-minutes: 10
  lock:
    timeout-seconds: 30
    prefix: "seat:lock:"
  redis:
    instance-count: 1
  scheduler:
    cleanup:
      enabled: true
      interval: 60s

#
# Gatling Configuration
# https://gatling.io/docs/gatling/reference/current/core/configuration/
#

gatling {
  core {
    outputDirectoryBaseName = "gatling-results"
    runDescription = "Ticket Booking System Load Test"
    encoding = "utf-8"
    simulationClass = ""

    extract {
      regex {
        cacheMaxCapacity = 200
      }
      xpath {
        cacheMaxCapacity = 200
      }
      jsonPath {
        cacheMaxCapacity = 200
      }
      css {
        cacheMaxCapacity = 200
      }
    }

    directory {
      simulations = ""
      resources = "src/test/resources"
      results = "target/gatling"
      binaries = ""
    }
  }

  socket {
    connectTimeout = 10000
    tcpNoDelay = true
    soKeepAlive = false
  }

  netty {
    useNativeTransport = true
    allocator = "pooled"
    maxThreadLocalCharBufferSize = 200000
  }

  http {
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    perUserCacheMaxCapacity = 200
    warmUpUrl = "https://gatling.io"

    ssl {
      useOpenSsl = true
      useOpenSslFinalizers = false
      handshakeTimeout = 10000
      useInsecureTrustManager = false
      enabledProtocols = []
      enabledCipherSuites = []
      sessionCacheSize = 0
      sessionTimeout = 0
      enableSni = true
    }

    dns {
      queryTimeout = 5000
      maxQueriesPerResolve = 6
    }

    pooledConnectionIdleTimeout = 60000
    requestTimeout = 60000
    enableHostnameVerification = false

    advanced {
      connectTimeout = 10000
      requestTimeout = 60000
      responseChunkAggregationLimit = 104857600
    }
  }

  data {
    writers = [console, file]
    console {
      light = false
      writePeriod = 5
    }
    file {
      bufferSize = 8192
    }
    leak {
      noActivityTimeout = 30
    }
  }

  charting {
    indicators {
      lowerBound = 800
      higherBound = 1200
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }
}

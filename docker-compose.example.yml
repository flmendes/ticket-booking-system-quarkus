# Docker Compose Example for Local Development
# Copy this to docker-compose.yml and adjust as needed

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: ticketuser
      POSTGRES_PASSWORD: ticketpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketuser -d ticketdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# Usage:
# 1. Copy this file: cp docker-compose.example.yml docker-compose.yml
# 2. Start services: docker-compose up -d
# 3. Check status: docker-compose ps
# 4. View logs: docker-compose logs -f
# 5. Stop services: docker-compose down

# For load tests, use:
# DB_HOST=host.docker.internal ./seed-test-data.sh
# DB_HOST=host.docker.internal ./reset-test-data.sh

name: CI/CD - Main (Native)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Step 1: Compile and Test
  compile-and-test:
    name: Compile and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verify GraalVM installation
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          native-image --version

      - name: Compile project
        run: ./mvnw clean compile -DskipTests

      - name: Run unit tests
        run: ./mvnw test

      - name: Run integration tests
        run: ./mvnw verify

      - name: Generate test report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (hashFiles('target/surefire-reports/*.xml') != '' || hashFiles('target/failsafe-reports/*.xml') != '') }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (Main)
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Generate JaCoCo report
        if: ${{ always() && (success() || failure()) }}
        run: ./mvnw -q jacoco:report -DskipTests

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('target/site/jacoco/index.html') != '' }}
        with:
          name: test-coverage-main
          path: target/site/jacoco/
          retention-days: 30

  # Step 2: Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: compile-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_ticket-booking-system \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: false

      - name: Run SpotBugs analysis
        run: ./mvnw com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Run PMD analysis
        run: ./mvnw pmd:check
        continue-on-error: true

      - name: Upload code quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-reports-main
          path: |
            target/site/checkstyle.html
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 30

  # Step 3: Security Scan
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: compile-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP Dependency Check
        run: |
          ./mvnw org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=.github/dependency-check-suppressions.xml

      - name: Run Snyk security scan
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-main
          path: |
            target/dependency-check-report.html
            trivy-results.sarif
          retention-days: 30

  # Step 4: Build and Push Native Docker Image
  build-native-image:
    name: Build Native Docker Image
    runs-on: ubuntu-latest
    needs: [compile-and-test, code-quality, security-scan]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-native-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-native-
            ${{ runner.os }}-m2-

      - name: Build native executable
        run: |
          ./mvnw clean package -Dnative \
            -DskipTests \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
        env:
          MAVEN_OPTS: "-Xmx4g"

      - name: Verify native executable
        run: |
          if ls target/*-runner 1> /dev/null 2>&1; then
            file target/*-runner
            ls -lh target/*-runner
          else
            echo "Native executable not found!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Native Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.native-micro
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            QUARKUS_PACKAGE_TYPE=native

      - name: Run Trivy vulnerability scanner (native image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-native-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload native image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-native-image-results.sarif'

      - name: Generate SBOM for native image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: cyclonedx-json
          output-file: sbom-native.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-native
          path: sbom-native.json
          retention-days: 90

      - name: Compare image sizes
        run: |
          echo "## Docker Image Size Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image Type | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------|" >> $GITHUB_STEP_SUMMARY
          NATIVE_SIZE=$(docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format "{{.Size}}")
          echo "| Native | $NATIVE_SIZE |" >> $GITHUB_STEP_SUMMARY

  # Performance Testing
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: build-native-image
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull native image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d postgres redis

      - name: Run native image
        run: |
          docker run -d \
            --name app \
            --network host \
            -e QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/ticketing \
            -e QUARKUS_REDIS_HOSTS=redis://localhost:6379 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Wait for application
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/q/health; do sleep 2; done'

      - name: Run performance tests
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz -L | tar xvz
          if [ -f "k6-load-test.js" ]; then
            ./k6-v0.47.0-linux-amd64/k6 run k6-load-test.js
          fi

      - name: Cleanup
        if: always()
        run: |
          docker-compose down
          docker stop app || true
          docker rm app || true

  # Notification
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [compile-and-test, code-quality, security-scan, build-native-image]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.build-native-image.result }}" == "success" ]; then
            echo "✅ Native build completed successfully for main branch"
            echo "📦 Native image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          else
            echo "❌ Build failed for main branch"
            exit 1
          fi

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Type**: Native (GraalVM)" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: CI/CD - Develop (JVM)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Step 1: Compile and Test
  compile-and-test:
    name: Compile and Test
    runs-on: ubuntu-latest
    # Note: Tests use H2 in-memory database, no external services needed
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile project
        id: compile
        run: ./mvnw clean compile -DskipTests

      - name: Run unit tests
        id: test
        run: ./mvnw test
        continue-on-error: true

      - name: Run integration tests
        id: verify
        run: ./mvnw verify
        continue-on-error: true

      - name: Upload build artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-develop
          path: |
            target/*.jar
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 1

      - name: Generate test report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.test.outcome != 'skipped' || steps.verify.outcome != 'skipped') }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (Develop)
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Generate JaCoCo report
        if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: ./mvnw -q jacoco:report -DskipTests
        continue-on-error: true

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('target/site/jacoco/index.html') != '' }}
        with:
          name: test-coverage-develop
          path: target/site/jacoco/
          retention-days: 7

  # Step 2: Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: compile-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-develop
          path: target/

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_ticket-booking-system \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Run SpotBugs analysis
        run: ./mvnw com.github.spotbugs:spotbugs-maven-plugin:check -DskipTests
        continue-on-error: true

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -DskipTests
        continue-on-error: true

      - name: Upload code quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-reports-develop
          path: |
            target/site/checkstyle.html
            target/spotbugsXml.xml
          retention-days: 7

  # Step 3: Security Scan
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: compile-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-develop
          path: target/


  # Step 4: Build and Push JVM Docker Image
  build-jvm-image:
    name: Build JVM Docker Image
    runs-on: ubuntu-latest
    needs: [compile-and-test, code-quality, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=develop-
            type=raw,value=develop-latest

      - name: Build and push JVM Docker image (Alpine optimized)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata for distroless-jlink
        id: meta-distroless
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-distroless
            type=sha,prefix=develop-distroless-
            type=raw,value=develop-distroless-latest
          flavor: |
            latest=false

      - name: Build and push Distroless+jlink Docker image (134MB - Most Secure)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm.distroless-jlink
          push: true
          tags: ${{ steps.meta-distroless.outputs.tags }}
          labels: ${{ steps.meta-distroless.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata for ultra-optimized
        id: meta-optimized
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-optimized
            type=sha,prefix=develop-optimized-
            type=raw,value=develop-optimized-latest
          flavor: |
            latest=false

      - name: Build and push Ultra-optimized Docker image (125MB - Smallest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm.optimized
          push: true
          tags: ${{ steps.meta-optimized.outputs.tags }}
          labels: ${{ steps.meta-optimized.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-latest
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-develop
          path: sbom.json
          retention-days: 30

  # Notification
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [compile-and-test, code-quality, security-scan, build-jvm-image]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.build-jvm-image.result }}" == "success" ]; then
            echo "✅ Build completed successfully for develop branch (JVM)"
          else
            echo "❌ Build failed for develop branch"
            exit 1
          fi
